# ── Banco H2 em memória ────────────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ── Email (desabilitado em testes — EmailService é @MockBean) ──────────────────
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# ── JWT (mesmo secret do app principal) ───────────────────────────────────────
jwt.secret=9a4f2c8d3b7a1e6f9g8h7i6j5k4l3m2n1o0p9q8r7s6t5u4v3w2x1y0zABCDEF1234567890abcdef1234567890
jwt.expiration-ms=86400000
jwt.refresh-expiration-ms=604800000

# ── Upload ────────────────────────────────────────────────────────────────────
app.upload.dir=target/test-uploads
app.upload.max-size=2097152
app.upload.max-width=1200
app.upload.max-height=1200
app.upload.quality=0.85

# ── Spring ────────────────────────────────────────────────────────────────────
spring.main.allow-bean-definition-overriding=true
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.com.example.ilhafit=WARN
