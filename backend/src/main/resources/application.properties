spring.application.name=backend

spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.cache-duration=3600
spring.messages.fallback-to-system-locale=false

spring.datasource.url=jdbc:postgresql://localhost:5432/ilhafit
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Upload
app.upload.dir=/app/uploads
app.upload.max-size=2097152
app.upload.max-width=1200
app.upload.max-height=1200
app.upload.quality=0.85

# Multipart
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=20MB

# JWT
jwt.secret=9a4f2c8d3b7a1e6f9g8h7i6j5k4l3m2n1o0p9q8r7s6t5u4v3w2x1y0zABCDEF1234567890abcdef1234567890
jwt.expiration-ms=86400000
jwt.refresh-expiration-ms=604800000
